name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-24.04 # FFmpeg 6.1: ffmpeg-next 7.1 does not link against the FFmpeg 8 of ubuntu-latest (26.04)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - run: sudo apt-get update && sudo apt-get install -y libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavdevice-dev libavfilter-dev libswresample-dev pkg-config clang libclang-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
