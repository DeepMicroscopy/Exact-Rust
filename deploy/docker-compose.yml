# Beta installation: PostgreSQL + server + registration worker, like EXACT's own docker-compose (database in a container).
#   cp deploy/exact.env.example deploy/exact.env   # fill in; IMAGE_PATH, MEDIA_ROOT, EXACT_CACHE_DIR are the host folders
#   alias dc='docker compose --env-file deploy/exact.env -f deploy/docker-compose.yml'   # the env file also fills ${...} below
#   dc build && dc up -d db
#   dc exec -T db pg_restore --no-owner --role="$SQL_USER" -U "$SQL_USER" -d "$SQL_DATABASE" < production.dump   # a pg_dump -Fc of EXACT (PostgreSQL 12 or newer)
#   dc run --rm server sh -c 'exact-cli migrate --confirm-db "$SQL_DATABASE"'
#   dc up -d
# The database lives in the volume `pgdata` (`dc down -v` throws it away) and is reachable by the other services as host `db`
# (SQL_HOST in exact.env is ignored here). For psql / scripts/audit-backup.sh on the host it is published on 127.0.0.1:5433.
# IMAGE_MODE=ro (default) mounts the image store read-only into the server: view-only, so the real files cannot be touched (uploads, move,
# delete, crop and repair then fail); set IMAGE_MODE=rw on a copy. CONTAINER_USER=0:0 for rootless Docker (container root is your host user).
# Inside the containers the folders are /data/images, /data/media and /data/cache.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${SQL_USER:?set SQL_USER in exact.env}
      POSTGRES_PASSWORD: ${SQL_PASSWORD:?set SQL_PASSWORD}
      POSTGRES_DB: ${SQL_DATABASE:?set SQL_DATABASE}
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 12
    restart: unless-stopped
  server:
    build: { context: .., dockerfile: deploy/Dockerfile }
    image: exact-rust
    user: "${CONTAINER_USER:-exact}"
    env_file: exact.env
    environment:
      SQL_HOST: db
      SQL_PORT: "5432"
      EXACT_LISTEN: 0.0.0.0:8002
      IMAGE_PATH: /data/images
      MEDIA_ROOT: /data/media
      EXACT_CACHE_DIR: /data/cache
      EXACT_NIFTI_CACHE: /data/cache/nifti
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:8002:8002"]   # the reverse proxy runs on the host
    volumes:
      - ${IMAGE_PATH:?set IMAGE_PATH in exact.env and export it for compose}:/data/images:${IMAGE_MODE:-ro}
      - ${MEDIA_ROOT:?set MEDIA_ROOT}:/data/media
      - ${EXACT_CACHE_DIR:?set EXACT_CACHE_DIR}:/data/cache
    restart: unless-stopped
  worker:
    image: exact-rust
    user: "${CONTAINER_USER:-exact}"
    depends_on: [server]
    healthcheck: { disable: true }   # the image's check asks the server port; the worker listens on none
    env_file: exact.env
    environment:
      IMAGE_PATH: /data/images
    # the worker reads the slide files itself (the paths the server hands out are the server's: /data/images/...)
    volumes:
      - ${IMAGE_PATH}:/data/images:ro
    command: ["sh", "-c", "python /app/helpers/queue_worker.py --url http://server:8002 --user \"$WORKER_USER\" --password \"$WORKER_PASSWORD\" --exact-dir /opt/exact/exact"]
    restart: unless-stopped
volumes:
  pgdata:
