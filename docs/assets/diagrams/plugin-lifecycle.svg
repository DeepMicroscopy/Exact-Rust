<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 980 385" width="980" height="385" role="img" aria-labelledby="t d"><title id="t">Worker lifecycle</title><desc id="d">A worker logs in, announces its plugins, claims jobs, runs a plugin, reports and waits.</desc><style>
text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#e6e9ef;font-size:14px}
.m{fill:#9aa4b2;font-size:12px}.h{font-weight:600;font-size:15px}.s{font-size:12px}.c{text-anchor:middle}.e{text-anchor:end}
.bg{fill:#11151f}.box{fill:#1b2231;stroke:#3a4660;stroke-width:1.5}.core{fill:#12304c;stroke:#5aa2ff;stroke-width:1.5}
.db{fill:#12372f;stroke:#2dd4bf;stroke-width:1.5}.ext{fill:#2a2340;stroke:#a78bfa;stroke-width:1.5}.warn{fill:#3a2e12;stroke:#fbbf24;stroke-width:1.5}
.rose{fill:#3b1d27;stroke:#fb7185;stroke-width:1.5}
.line{stroke:#5b6a88;stroke-width:1.6;fill:none}.dash{stroke-dasharray:5 5}
@media (prefers-reduced-motion: reduce){.anim{display:none}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6a88"/></marker></defs><rect class="bg" width="980" height="385" rx="12"/><text x="30" y="30" class="h">The life of a worker (helpers/queue_worker.py)</text><rect x="60" y="100" width="190" height="70" rx="8" class="core"/><text x="155.0" y="131.0" class="h c">Start</text><text x="155.0" y="150.0" class="m c">log in with the worker account</text><rect x="290" y="100" width="190" height="70" rx="8" class="box"/><text x="385.0" y="131.0" class="h c">Announce</text><text x="385.0" y="150.0" class="m c">POST /api/v2/plugins/register</text><rect x="520" y="100" width="190" height="70" rx="8" class="ext"/><text x="615.0" y="131.0" class="h c">Claim</text><text x="615.0" y="150.0" class="m c">POST /api/v2/jobs/claim</text><rect x="750" y="100" width="190" height="70" rx="8" class="ext"/><text x="845.0" y="131.0" class="h c">Run the plugin</text><text x="845.0" y="150.0" class="m c">plugin.run(job, ctx)</text><rect x="750" y="250" width="190" height="70" rx="8" class="db"/><text x="845.0" y="281.0" class="h c">Report</text><text x="845.0" y="300.0" class="m c">progress · complete · fail</text><rect x="520" y="250" width="190" height="70" rx="8" class="box"/><text x="615.0" y="281.0" class="h c">Idle</text><text x="615.0" y="300.0" class="m c">sleep a few seconds</text><path id="p1" d="M250 135 L290 135" class="line" marker-end="url(#ar)"/><path id="p2" d="M480 135 L520 135" class="line" marker-end="url(#ar)"/><path id="p3" d="M710 135 L750 135" class="line" marker-end="url(#ar)"/><path id="p4" d="M845 170 L845 250" class="line" marker-end="url(#ar)"/><path id="p5" d="M750 285 L710 285" class="line" marker-end="url(#ar)"/><path id="p6" d="M520 285 L430 285 L430 235 L615 235 L615 170" class="line" marker-end="url(#ar)"/><path id="p7" d="M615 100 L615 70 L385 70 L385 100" class="line dash" marker-end="url(#ar)"/><text x="500" y="62" class="m c">announce again every 10 minutes</text><text x="480" y="230" class="m"></text><path id="loop" d="M155 135 L385 135 L615 135 L845 135 L845 285 L615 285 L430 285 L430 235 L615 235 L615 135" fill="none" stroke="none"/><circle r="7" fill="#fbbf24" class="anim"><animateMotion dur="9s" repeatCount="indefinite"><mpath xlink:href="#loop" href="#loop"/></animateMotion></circle><text x="60" y="340" class="m">204 from the claim means nothing is waiting: the worker sleeps and asks again. A job whose worker disappears is offered again after 30 minutes.</text><text x="60" y="360" class="m">A plugin that cannot run here (missing library, missing model file) says why in the log and is not announced; the others carry on.</text></svg>