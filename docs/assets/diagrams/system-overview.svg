</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6a88"/></marker></defs><rect class="bg" width="1010" height="580" rx="12"/><text x="30" y="30" class="h">EXACT-Rust: who talks to whom</text><rect x="30" y="70" width="230" height="64" rx="8" class="core"/><text x="145.0" y="98.0" class="h c">Browser</text><text x="145.0" y="117.0" class="m c">React · TypeScript · OpenSeadragon</text><rect x="30" y="160" width="230" height="64" rx="8" class="box"/><text x="145.0" y="188.0" class="h c">exact-sync · notebooks</text><text x="145.0" y="207.0" class="m c">Python client, /api/v1 (unchanged)</text><rect x="30" y="250" width="230" height="64" rx="8" class="ext"/><text x="145.0" y="278.0" class="h c">Queue worker</text><text x="145.0" y="297.0" class="m c">registration · image analysis (Python)</text><rect x="30" y="340" width="230" height="64" rx="8" class="ext"/><text x="145.0" y="368.0" class="h c">Segmentation worker</text><text x="145.0" y="387.0" class="m c">masks for volumes (Python)</text><rect x="340" y="46" width="330" height="436" rx="12" class="core" fill-opacity="0.35"/><text x="505" y="70" class="h c">exact-server: one Rust binary</text><rect x="360" y="86" width="290" height="54" rx="8" class="box"/><text x="505.0" y="109.0" class="h c">Front end</text><text x="505.0" y="128.0" class="m c">the built React app (static files)</text><rect x="360" y="150" width="290" height="54" rx="8" class="box"/><text x="505.0" y="173.0" class="h c">/api/v2</text><text x="505.0" y="192.0" class="m c">the interface of the new UI</text><rect x="360" y="214" width="290" height="54" rx="8" class="box"/><text x="505.0" y="237.0" class="h c">/api/v1 + legacy</text><text x="505.0" y="256.0" class="m c">compatible with EXACT (exact-sync)</text><rect x="360" y="278" width="290" height="54" rx="8" class="box"/><text x="505.0" y="301.0" class="h c">Slides and tiles</text><text 