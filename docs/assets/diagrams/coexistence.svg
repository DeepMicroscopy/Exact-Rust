<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 505" width="900" height="505" role="img" aria-labelledby="t d"><title id="t">Coexistence with Django</title><desc id="d">Django and the Rust server read and write the same database tables and the same image folders; the Rust server adds tables of its own.</desc><style>
text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#e6e9ef;font-size:14px}
.m{fill:#9aa4b2;font-size:12px}.h{font-weight:600;font-size:15px}.s{font-size:12px}.c{text-anchor:middle}.e{text-anchor:end}
.bg{fill:#11151f}.box{fill:#1b2231;stroke:#3a4660;stroke-width:1.5}.core{fill:#12304c;stroke:#5aa2ff;stroke-width:1.5}
.db{fill:#12372f;stroke:#2dd4bf;stroke-width:1.5}.ext{fill:#2a2340;stroke:#a78bfa;stroke-width:1.5}.warn{fill:#3a2e12;stroke:#fbbf24;stroke-width:1.5}
.rose{fill:#3b1d27;stroke:#fb7185;stroke-width:1.5}
.line{stroke:#5b6a88;stroke-width:1.6;fill:none}.dash{stroke-dasharray:5 5}
@media (prefers-reduced-motion: reduce){.anim{display:none}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6a88"/></marker></defs><rect class="bg" width="900" height="505" rx="12"/><text x="30" y="30" class="h">Rust and Django side by side on one database and one image store</text><rect x="30" y="60" width="250" height="90" rx="8" class="ext"/><text x="155.0" y="101.0" class="h c">EXACT (Django)</text><text x="155.0" y="120.0" class="m c">unchanged, as before</text><rect x="620" y="60" width="250" height="90" rx="8" class="core"/><text x="745.0" y="101.0" class="h c">EXACT-Rust</text><text x="745.0" y="120.0" class="m c">exact-server</text><rect x="330" y="60" width="240" height="90" rx="8" class="warn"/><text x="450.0" y="92.0" class="h c">Kept separate</text><text x="450.0" y="111.0" class="m c">browser sessions, passkey origin</text><text x="450.0" y="127.0" class="m c">caches (one per server)</text><rect x="250" y="190" width="400" height="140" rx="12" class="db" fill-opacity="0.4"/><text x="450" y="214" class="h c">PostgreSQL</text><rect x="268" y="228" width="170" height="86" rx="8" class="box"/><text x="353.0" y="258.0" class="h c">Django's tables</text><text x="353.0" y="277.0" class="m c">images_* annotations_*</text><text x="353.0" y="293.0" class="m c">users_* processing_*</text><rect x="462" y="228" width="170" height="86" rx="8" class="box"/><text x="547.0" y="258.0" class="h c">Rust's own tables</text><text x="547.0" y="277.0" class="m c">exact_rust_sessions</text><text x="547.0" y="293.0" class="m c">invitations, passkeys, flags</text><rect x="250" y="360" width="400" height="70" rx="8" class="db"/><text x="450.0" y="391.0" class="h c">Image store</text><text x="450.0" y="410.0" class="m c">IMAGE_PATH + MEDIA_ROOT: the same folders, the same file modes</text><path id="l1" d="M155 150 L155 250 L268 250" class="line"/><path id="l2" d="M745 150 L745 250 L632 250" class="line"/><path id="l3" d="M95 150 L95 395 L250 395" class="line"/><path id="l4" d="M805 150 L805 395 L650 395" class="line"/><circle r="5" fill="#a78bfa" class="anim" opacity="0.95"><animateMotion dur="2.4s" begin="0.0s" repeatCount="indefinite" ><mpath xlink:href="#l1" href="#l1"/></animateMotion></circle><circle r="5" fill="#a78bfa" class="anim" opacity="0.95"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear" ><mpath xlink:href="#l1" href="#l1"/></animateMotion></circle><circle r="5" fill="#5aa2ff" class="anim" opacity="0.95"><animateMotion dur="2.4s" begin="0.4s" repeatCount="indefinite" ><mpath xlink:href="#l2" href="#l2"/></animateMotion></circle><circle r="5" fill="#5aa2ff" class="anim" opacity="0.95"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear" ><mpath xlink:href="#l2" href="#l2"/></animateMotion></circle><circle r="5" fill="#a78bfa" class="anim" opacity="0.95"><animateMotion dur="3.4s" begin="0.2s" repeatCount="indefinite" ><mpath xlink:href="#l3" href="#l3"/></animateMotion></circle><circle r="5" fill="#a78bfa" class="anim" opacity="0.95"><animateMotion dur="3.4s" begin="1.9s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear" ><mpath xlink:href="#l3" href="#l3"/></animateMotion></circle><circle r="5" fill="#5aa2ff" class="anim" opacity="0.95"><animateMotion dur="3.4s" begin="0.9s" repeatCount="indefinite" ><mpath xlink:href="#l4" href="#l4"/></animateMotion></circle><circle r="5" fill="#5aa2ff" class="anim" opacity="0.95"><animateMotion dur="3.4s" begin="2.6s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear" ><mpath xlink:href="#l4" href="#l4"/></animateMotion></circle><text x="30" y="462" class="m">Additive only: the Rust migration adds tables and columns (IF NOT EXISTS), never changes or drops one of Django's.</text><text x="30" y="482" class="m">Django's own migration adds the same objects with the same DDL, so either may run first. Roll back = stop the Rust server.</text></svg>