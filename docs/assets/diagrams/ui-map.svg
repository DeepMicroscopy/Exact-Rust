<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d"><title id="t">Screens of the web interface</title><desc id="d">From invitation or login to the list of image sets, an image set, and the viewer; jobs, administration and preferences are reachable from the top bar.</desc><style>
