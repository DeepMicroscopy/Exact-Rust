<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 990 485" width="990" height="485" role="img" aria-labelledby="t d"><title id="t">API layers</title><desc id="d">Clients reach the compatible v1 API, the v2 API or the v2 job endpoints; all use the same engine and database.</desc><style>
text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#e6e9ef;font-size:14px}
.m{fill:#9aa4b2;font-size:12px}.h{font-weight:600;font-size:15px}.s{font-size:12px}.c{text-anchor:middle}.e{text-anchor:end}
.bg{fill:#11151f}.box{fill:#1b2231;stroke:#3a4660;stroke-width:1.5}.core{fill:#12304c;stroke:#5aa2ff;stroke-width:1.5}
.db{fill:#12372f;stroke:#2dd4bf;stroke-width:1.5}.ext{fill:#2a2340;stroke:#a78bfa;stroke-width:1.5}.warn{fill:#3a2e12;stroke:#fbbf24;stroke-width:1.5}
.rose{fill:#3b1d27;stroke:#fb7185;stroke-width:1.5}
.line{stroke:#5b6a88;stroke-width:1.6;fill:none}.dash{stroke-dasharray:5 5}
@media (prefers-reduced-motion: reduce){.anim{display:none}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6a88"/></marker></defs><rect class="bg" width="990" height="485" rx="12"/><text x="30" y="30" class="h">Three doors, one engine</text><rect x="30" y="70" width="230" height="64" rx="8" class="box"/><text x="145.0" y="98.0" class="h c">exact-sync · notebooks</text><text x="145.0" y="117.0" class="m c">Basic or token</text><rect x="30" y="160" width="230" height="64" rx="8" class="core"/><text x="145.0" y="188.0" class="h c">Web interface</text><text x="145.0" y="207.0" class="m c">session cookie + CSRF header</text><rect x="30" y="250" width="230" height="64" rx="8" class="ext"/><text x="145.0" y="278.0" class="h c">Workers</text><text x="145.0" y="297.0" class="m c">Basic or token, v2 job endpoints</text><rect x="340" y="70" width="250" height="64" rx="8" class="box"/><text x="465.0" y="98.0" class="h c">/api/v1 + legacy paths</text><text x="465.0" y="117.0" class="m c">byte-compatible with EXACT</text><rect x="340" y="160" width="250" height="64" rx="8" class="core"/><text x="465.0" y="188.0" class="h c">/api/v2</text><text x="465.0" y="207.0" class="m c">JSON, snake_case, cursor paging</text><rect x="340" y="250" width="250" height="64" rx="8" class="ext"/><text x="465.0" y="278.0" class="h c">/api/v2 jobs</text><text x="465.0" y="297.0" class="m c">claim · progress · complete · fail</text><rect x="670" y="70" width="280" height="244" rx="8" class="warn"/><text x="810.0" y="161.0" class="h c">Shared engine</text><text x="810.0" y="180.0" class="m c">authentication and permissions</text><text x="810.0" y="196.0" class="m c">team scope on every list</text><text x="810.0" y="212.0" class="m c">filters, ordering, expansion</text><text x="810.0" y="228.0" class="m c">transactions</text><rect x="670" y="340" width="280" height="60" rx="8" class="db"/><text x="810.0" y="366.0" class="h c">PostgreSQL</text><text x="810.0" y="385.0" class="m c">EXACT's schema</text><path id="a0" d="M260 102 L340 102" class="line" marker-end="url(#ar)"/><path id="b0" d="M590 102 L670 102" class="line" marker-end="url(#ar)"/><circle r="5" fill="#fbbf24" class="anim" opacity="0.95"><animateMotion dur="1.6s" begin="0.0s" repeatCount="indefinite" ><mpath xlink:href="#a0" href="#a0"/></animateMotion></circle><circle r="5" fill="#fbbf24" class="anim" opacity="0.95"><animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite" ><mpath xlink:href="#b0" href="#b0"/></animateMotion></circle><path id="a1" d="M260 192 L340 192" class="line" marker-end="url(#ar)"/><path id="b1" d="M590 192 L670 192" class="line" marker-end="url(#ar)"/><circle r="5" fill="#5aa2ff" class="anim" opacity="0.95"><animateMotion dur="1.6s" begin="0.5s" repeatCount="indefinite" ><mpath xlink:href="#a1" href="#a1"/></animateMotion></circle><circle r="5" fill="#5aa2ff" class="anim" opacity="0.95"><animateMotion dur="1.6s" begin="1.3s" repeatCount="indefinite" ><mpath xlink:href="#b1" href="#b1"/></animateMotion></circle><path id="a2" d="M260 282 L340 282" class="line" marker-end="url(#ar)"/><path id="b2" d="M590 282 L670 282" class="line" marker-end="url(#ar)"/><circle r="5" fill="#a78bfa" class="anim" opacity="0.95"><animateMotion dur="1.6s" begin="1.0s" repeatCount="indefinite" ><mpath xlink:href="#a2" href="#a2"/></animateMotion></circle><circle r="5" fill="#a78bfa" class="anim" opacity="0.95"><animateMotion dur="1.6s" begin="1.8s" repeatCount="indefinite" ><mpath xlink:href="#b2" href="#b2"/></animateMotion></circle><path id="c" d="M810 314 L810 340" class="line" marker-end="url(#ar)"/><circle r="4" fill="#2dd4bf" class="anim" opacity="0.95"><animateMotion dur="1.0s" begin="0.0s" repeatCount="indefinite" ><mpath xlink:href="#c" href="#c"/></animateMotion></circle><text x="30" y="440" class="m">v1 answers exactly as Django did (flat ids, DRF pagination) so exact-sync keeps working; v2 is free to be cleaner.</text><text x="30" y="460" class="m">Both read the same rows through the same code: a change made through one door is visible through the others at once.</text></svg>