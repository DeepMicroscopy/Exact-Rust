[workspace]
resolver = "2"
members = ["crates/exact-core", "crates/exact-auth", "crates/exact-db", "crates/exact-wsi", "crates/exact-api", "crates/exact-server", "crates/exact-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "process"] }
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["trace", "compression-full", "cors", "fs"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "chrono", "json", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
moka = { version = "0.12", features = ["sync"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
exact-core = { path = "crates/exact-core" }
exact-db = { path = "crates/exact-db" }
exact-auth = { path = "crates/exact-auth" }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
form_urlencoded = "1"
exact-wsi = { path = "crates/exact-wsi" }
exact-api = { path = "crates/exact-api" }

[profile.release]
lto = "thin"
codegen-units = 1

# Password hashing is deliberately slow; keep crypto crates optimized even in debug builds.
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blowfish]
opt-level = 3
[profile.dev.package.bcrypt]
opt-level = 3
[profile.dev.package.exact-auth]
opt-level = 3

# Image decoding in debug builds is unusably slow otherwise (tiles, LZW, JPEG, Lanczos).
[profile.dev.package."*"]
opt-level = 2
# The 3D mask engine and the render data loop over millions of voxels.
[profile.dev.package.exact-api]
opt-level = 2
[profile.dev.package.exact-wsi]
opt-level = 2
